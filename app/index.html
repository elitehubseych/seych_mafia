<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Мафия — стол</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="header">
    <div class="hdr-left">
      <span id="roomCode" class="room-code">—</span>
      <span id="stateBadge" class="badge">…</span>
    </div>
    <div id="nightLabel" class="night-label"></div>
  </header>

  <main id="tableWrap">
    <div id="table" class="table">
      <div class="table-glow"></div>
      <div id="timeline" class="timeline">
        <div id="timelineInner"></div>
      </div>
      <div id="selfCard" class="self-card"></div>
    </div>
  </main>

  <footer id="footer">
    <div id="actionArea" class="action-area"></div>
    <div id="chatWrap" class="chat-wrap hidden">
      <div class="chat-hint" id="chatHint"></div>
      <div class="chat-row">
        <input id="chatInput" type="text" maxlength="500" placeholder="Сообщение…" autocomplete="off" />
        <button id="chatSend" class="btn btn-primary">➤</button>
      </div>
    </div>
  </footer>

  <div id="roleCard" class="role-card hidden"></div>

  <div id="enterScreen" class="enter-screen">
    <div class="enter-box">
      <h1>🎭 Мафия</h1>
      <p>Введи код комнаты из чата:</p>
      <input id="codeInput" type="text" maxlength="8" placeholder="Код комнаты" autocomplete="off" />
      <button id="codeGo" class="btn btn-primary btn-block">Войти</button>
      <div id="enterError" class="enter-error"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/@vkontakte/vk-bridge@2.12.1/dist/browser.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
